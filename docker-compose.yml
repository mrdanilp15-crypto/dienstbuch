version: '3.8'

services:
  db:
    image: mariadb:10.6
    container_name: attendance_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASS:-dein_ganz_geheimes_root_passwort}
      MYSQL_DATABASE: ${DB_NAME:-attendance_system}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASS:-dein_app_passwort}
    volumes:
      - db_data:/var/lib/mysql

  api:
    image: ghcr.io/mrdanilp15-crypto/dienstbuch:main
    container_name: attendance_api
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-app_user}
      - DB_PASSWORD=${DB_PASS:-dein_app_passwort}
      - DB_NAME=${DB_NAME:-attendance_system}
      - TOWN_NAME=${TOWN_NAME:-Musterstadt}
      - SECRET_KEY=${SECRET_KEY:-feuerwehr-dienstbuch-geheimschluessel-112}
    ports:
      - "9000:8000"
    volumes:
      - notes_data:/app/data
    depends_on:
      - db

volumes:
  db_data:
  notes_data:

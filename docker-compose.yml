version: '3.8'

services:
  db:
    image: mariadb:10.6
    container_name: attendance_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_pass
      MYSQL_DATABASE: attendance_system
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_db_password
    volumes:
      - db_data:/var/lib/mysql

  api:
    image: ghcr.io/mrdanilp15-crypto/dienstbuch:main
    container_name: attendance_api
    restart: unless-stopped
    environment:
      - DB_PASSWORD=app_db_password
      - TOWN_NAME=Feuerwehr Neustadt
    ports:
      - "9000:8000"
    volumes:
      - notes_data:/app/data
      - media_data:/app/media
    depends_on:
      - db

volumes:
  db_data:
  notes_data:
  media_data:
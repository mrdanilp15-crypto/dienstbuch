                <!-- TAB 5: PERSONALVERWALTUNG -->
                <div v-show="activeTab === 'personal'">
                    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2 page-head">
                        <div>
                            <h2 class="fw-bold m-0 text-white"><i class="fa fa-users text-danger me-2"></i>Personal</h2>
                            <small class="text-muted">Dienstgrade, Lehrgänge, Bekleidung und Atemschutzüberwachung</small>
                        </div>
                        <div class="d-flex gap-2">
                            <button v-if="canManagePersonnel" class="btn btn-premium rounded-pill" @click="openPersonnelModal"><i class="fa fa-plus-circle me-1"></i>Neues Mitglied</button>
                            <div class="position-relative action-menu">
                                <button type="button" class="btn btn-outline-light rounded-pill" @click="toggleAction('personal')"><i class="fa fa-ellipsis me-1"></i>Mehr</button>
                                <div v-if="openIncident === 'personal'" class="incident-menu" @click="openIncident = null">
                                    <button type="button" @click="openAnniversariesModal"><i class="fa fa-award"></i>Jubiläen</button>
                                    <a v-if="isAdmin || role === 'leitung'" href="/api/personnel/roster/pdf" target="_blank"><i class="fa fa-file-pdf"></i>Mitgliederliste (PDF)</a>
                                    <button v-if="isAdmin || role === 'leitung'" type="button" @click="openQualMatrixModal"><i class="fa fa-table-cells"></i>Qualifikationsmatrix</button>
                                    <button v-if="canManageMaterial" type="button" @click="openClothingModal"><i class="fa fa-shirt"></i>Kleiderkammer</button>
                                    <button v-if="canManageProspects" type="button" @click="openProspectsModal"><i class="fa fa-handshake"></i>Nachwuchs</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <due-strip area="personal" :items="dueItems" @goto="goToDue" @done="doneDue" @done-bulk="doneDueBulk"></due-strip>

                    <div class="row g-3 mb-4">
                        <div class="col-12 col-md-6">
                            <input type="text" v-model="personnelSearch" class="form-control" placeholder="Kamerad suchen...">
                        </div>
                    </div>

                    <div class="person-grid">
                        <div v-for="p in filteredPersonnel" :key="p.id" class="member-card d-flex align-items-center gap-3" @click="editPersonnel(p)">
                            <div class="avatar-container">
                                <img :src="p.profile_picture || (p.has_picture ? '/api/personnel/avatar/' + p.id + '?v=' + cacheBuster : '/static/img/avatar.svg')" alt="Profilbild">
                            </div>
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between align-items-start flex-wrap gap-1">
                                    <h6 class="fw-bold m-0 text-white">{{ p.name }}</h6>
                                    <span :class="'badge-status status-' + getStatusClass(p.membership_status)">{{ p.membership_status }}</span>
                                </div>
                                <small class="text-danger fw-bold d-block mt-1" style="font-size:0.75rem;">{{ p.rank || 'Anwärter' }}</small>
                                <div class="d-flex flex-wrap gap-1 mt-2">
                                    <span v-if="p.is_gf" class="badge bg-danger font-monospace" style="font-size:0.55rem; padding: 3px 5px;">GF</span>
                                    <span v-if="p.is_tf" class="badge bg-warning text-dark font-monospace" style="font-size:0.55rem; padding: 3px 5px;">TF</span>
                                    <span v-if="p.is_agt" class="badge bg-dark font-monospace border border-secondary" style="font-size:0.55rem; padding: 3px 5px;">AGT</span>
                                    <span v-if="p.is_maschinist" class="badge bg-secondary font-monospace" style="font-size:0.55rem; padding: 3px 5px;">MA</span>
                                </div>
                            </div>
                        </div>
                        <div v-if="filteredPersonnel.length === 0" class="empty-state">
                            <i class="fa-solid fa-user-slash"></i>
                            <p>{{ personnelSearch ? 'Niemand passt zur Suche.' : 'Noch keine Mitglieder angelegt.' }}</p>
                            <button v-if="personnelSearch" class="btn btn-sm btn-outline-light rounded-pill" @click="personnelSearch = ''">Suche leeren</button>
                            <button v-else-if="canManagePersonnel" class="btn btn-sm btn-premium rounded-pill" @click="openPersonnelModal">Erstes Mitglied anlegen</button>
                        </div>
                    </div>
                </div>

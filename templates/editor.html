<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dienstbuch — Protokoll-Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.prod.js"></script>
    <style>
        [v-cloak] { display: none !important; }
        body { background: #f1f5f9; color: #1e293b; padding: 40px 20px; }
        .editor-card { background: white; border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 10px 30px rgba(15,23,42,0.04); }
    </style>
</head>
<body>
    <div id="editorApp" v-cloak class="container style-container" style="max-width: 900px;">
        <div class="card editor-card p-4 md-5">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                <h2 class="fw-bold m-0 text-dark"><i class="fa fa-pen-nib text-danger me-2"></i>Dienstbericht verfassen</h2>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-secondary rounded-pill fw-bold" @click="abort()">Abbrechen</button>
                    <button type="button" class="btn btn-danger rounded-pill fw-bold px-4" @click="saveReport()">Bericht sichern</button>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label small fw-bold text-uppercase text-muted">Datum des Dienstes</label>
                    <input type="date" v-model="session.date" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold text-uppercase text-muted">Dienstkategorie</label>
                    <select v-model="session.category" class="form-select fw-semibold">
                        <option value="Übung">Übungsdienst / Ausbildung</option>
                        <option value="Einsatz">Einsatzbericht</option>
                        <option value="Sonstiges">Sonstige Veranstaltung / Wache</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold text-uppercase text-muted">Dauer (in Stunden)</label>
                    <input type="number" step="0.5" v-model="session.duration" class="form-control font-monospace">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-uppercase text-muted">Thema / Einsatzstichwort</label>
                <input type="text" v-model="session.description" class="form-control fw-bold fs-5 text-dark" placeholder="z.B. Technische Hilfeleistung — VU Person eingeklemmt">
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-uppercase text-muted">Ausbilder / Einsatzleiter</label>
                <input type="text" v-model="session.instructors" class="form-control" placeholder="Name eintragen...">
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-uppercase text-muted">Detaillierter Berichtsinhalt / Logbucheintrag</label>
                <textarea rows="6" v-model="session.content" class="form-control" placeholder="Ausbildungsinhalt oder Einsatzverlauf dokumentieren..."></textarea>
            </div>

            <h4 class="text-dark border-bottom pb-2 mb-3"><i class="fa fa-users text-muted me-2"></i>Mannschaft & Fahrzeugbesetzung</h4>
            <div class="table-responsive rounded-3 border overflow-hidden">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr class="small fw-bold text-secondary">
                            <th class="ps-3">Kamerad</th>
                            <th class="text-center" style="width: 150px;">Anwesend</th>
                            <th>Fahrzeug-Zuweisung</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="p in attendanceList" :key="p.person_id">
                            <td class="ps-3 fw-bold text-dark">{{ p.name }}</td>
                            <td class="text-center">
                                <input type="checkbox" v-model="p.is_present" class="form-check-input" style="width: 20px; height: 20px;">
                            </td>
                            <td>
                                <select v-model="p.vehicle" class="form-select form-select-sm" :disabled="!p.is_present">
                                    <option value="">-- Kein Fahrzeug (Wache/Bereitschaft) --</option>
                                    <option v-for="v in vehicles" :key="v.id" :value="v.name">{{ v.name }}</option>
                                </select>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function ensureArray(data) {
            if (Array.isArray(data)) return data;
            if (data && typeof data === 'object') {
                for (var key in data) { if (Array.isArray(data[key])) return data[key]; }
            }
            return [];
        }

        Vue.createApp({
            data() {
                return {
                    sessionId: 0,
                    groupId: 1,
                    vehicles: [],
                    personnel: [],
                    attendance: [],
                    session: { date: new Date().toISOString().split('T')[0], category: 'Übung', duration: 2.0, description: '', content: '', instructors: '' },
                    attendanceList: []
                }
            },
            methods: {
                abort() { window.location.href = '/dashboard'; },
                async saveReport() {
                    const payload = {
                        session: this.session,
                        attendance: this.attendanceList.map(function(a) {
                            return { person_id: a.person_id, is_present: a.is_present ? 1 : 0, vehicle: a.vehicle };
                        })
                    };
                    const url = this.sessionId ? '/groups/' + this.groupId + '/sessions/' + this.sessionId : '/groups/' + this.groupId + '/sessions';
                    const method = this.sessionId ? 'PUT' : 'POST';

                    const res = await fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (res.ok) { 
                        window.location.href = '/dashboard'; 
                    } else { 
                        // DIAGNOSE-ALARM: Zeigt den genauen HTTP-Statuscode des Python-Backends an!
                        alert("PUT/POST-FEHLER BEIM SPEICHERN! Der Server meldet HTTP-Status: " + res.status + " (" + res.statusText + "). Prüfe, ob die Route in routers/sessions.py existiert."); 
                    }
                }
            },
            async mounted() {
                try {
                    const params = new URLSearchParams(window.location.search);
                    this.sessionId = parseInt(params.get('session_id')) || 0;
                    
                    const vRes = await fetch('/api/vehicles').catch(() => null);
                    const pRes = await fetch('/api/personnel/list').catch(() => null);
                    
                    this.vehicles = ensureArray(vRes && vRes.ok ? await vRes.json() : []);
                    this.personnel = ensureArray(pRes && pRes.ok ? await pRes.json() : []);
                    
                    if (this.sessionId) {
                        const sRes = await fetch('/groups/' + this.groupId + '/sessions/' + this.sessionId).catch(() => null);
                        if (sRes && sRes.ok) {
                            const sData = await sRes.json();
                            this.session = sData.session || this.session;
                            this.attendance = ensureArray(sData.attendance || []);
                        }
                    }

                    var self = this;
                    this.attendanceList = this.personnel.map(function(p) {
                        var match = self.attendance.find(function(a) { return a && a.person_id === p.id; });
                        return { person_id: p.id, name: p.name, is_present: match ? !!match.is_present : false, vehicle: match ? match.vehicle : "" };
                    });
                } catch (err) {
                    console.error("Kritisches Einfrieren im Editor verhindert:", err);
                }
            }
        }).mount('#editorApp');
    </script>
</body>
</html>

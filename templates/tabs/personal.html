<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Personalverwaltung & Systemlogins</h2>
    <div class="d-flex gap-2">
        <button v-if="subTabPers === 'akte'" type="button" class="btn btn-danger rounded-pill fw-bold" @click="openMemberModal(null)">
            <i class="fa fa-user-plus me-1"></i> Kamerad anlegen
        </button>
        <button v-if="subTabPers === 'logins'" type="button" class="btn btn-dark rounded-pill fw-bold" @click="openUserModal(null)">
            <i class="fa fa-key me-1"></i> Login erstellen
        </button>
    </div>
</div>

<!-- Sub-Tabs für Personal -->
<ul class="nav nav-tabs mb-4 border-bottom">
    <li class="nav-item">
        <button type="button" class="nav-link fw-bold text-dark border-0 py-2.5 px-4" :class="{active: subTabPers === 'akte'}" @click="subTabPers = 'akte'">
            <i class="fa fa-id-card me-2 text-muted"></i> Kameradenakten
        </button>
    </li>
    <li class="nav-item">
        <button type="button" class="nav-link fw-bold text-dark border-0 py-2.5 px-4" :class="{active: subTabPers === 'logins'}" @click="subTabPers = 'logins'">
            <i class="fa fa-shield-halved me-2 text-muted"></i> System-Logins / Konten
        </button>
    </li>
</ul>

<!-- SUB-TAB 1: KAMERADENAKTEN -->
<div v-if="subTabPers === 'akte'">
    <div class="card p-0 overflow-hidden bg-white border shadow-sm rounded-4">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead class="table-light border-bottom">
                    <tr class="text-secondary small fw-bold">
                        <th class="ps-4">Name</th>
                        <th>Dienstgrad</th>
                        <th>Status</th>
                        <th class="text-center">AGT</th>
                        <th class="text-center">Maschinist</th>
                        <th class="text-center">GF</th>
                        <th class="text-end pe-4">Aktionen</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="p in personnel" :key="p.id">
                        <td class="ps-4">
                            <div class="d-flex align-items-center gap-3">
                                <div class="avatar-container" style="width: 34px; height: 34px;">
                                    <img :src="p.profile_picture" v-if="p.profile_picture">
                                    <i class="fa fa-user text-muted" v-else></i>
                                </div>
                                <div class="fw-bold text-dark">{{ p.name }}</div>
                            </div>
                        </td>
                        <td class="fw-semibold text-secondary">{{ p.rank }}</td>
                        <td><span class="badge bg-success bg-opacity-10 text-success border border-success">{{ p.membership_status }}</span></td>
                        <td class="text-center">
                            <i class="fa fa-circle-check text-success fs-5" v-if="p.is_agt == 1 || p.is_agt === true"></i>
                            <i class="fa fa-circle-xmark text-muted opacity-50" v-else></i>
                        </td>
                        <td class="text-center">
                            <i class="fa fa-circle-check text-success fs-5" v-if="p.is_maschinist == 1 || p.is_maschinist === true"></i>
                            <i class="fa fa-circle-xmark text-muted opacity-50" v-else></i>
                        </td>
                        <td class="text-center">
                            <i class="fa fa-circle-check text-success fs-5" v-if="p.is_gf == 1 || p.is_gf === true"></i>
                            <i class="fa fa-circle-xmark text-muted opacity-50" v-else></i>
                        </td>
                        <td class="text-end pe-4">
                            <div class="d-flex gap-1 justify-content-end">
                                <button type="button" class="btn btn-sm btn-outline-secondary rounded-circle" @click="openMemberModal(p)" title="Akte bearbeiten">
                                    <i class="fa fa-pen"></i>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-danger rounded-circle" @click="deleteMember(p.id)" title="Akte löschen">
                                    <i class="fa fa-trash-can"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- SUB-TAB 2: SYSTEM-LOGINS -->
<div v-if="subTabPers === 'logins'">
    <div class="card p-0 overflow-hidden bg-white border shadow-sm rounded-4">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead class="table-light border-bottom">
                    <tr class="text-secondary small fw-bold">
                        <th class="ps-4">Benutzername</th>
                        <th>Systemrolle</th>
                        <th>Verknüpfte Akte</th>
                        <th class="text-end pe-4">Aktionen</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="u in users" :key="u.id">
                        <td class="ps-4 fw-bold text-dark">
                            <i class="fa fa-user-lock text-muted me-2"></i>{{ u.username }}
                        </td>
                        <td><span class="badge bg-dark font-monospace text-uppercase">{{ u.role }}</span></td>
                        <td class="text-muted fw-semibold">{{ getPersonnelName(u.personnel_id) }}</td>
                        <td class="text-end pe-4">
                            <div class="d-flex gap-1 justify-content-end">
                                <button type="button" class="btn btn-sm btn-outline-secondary rounded-circle" @click="openUserModal(u)" title="Passwort/Rolle ändern">
                                    <i class="fa fa-key"></i>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-danger rounded-circle" @click="deleteUser(u.id)" title="Login löschen">
                                    <i class="fa fa-trash-can"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

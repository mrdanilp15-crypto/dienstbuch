<div class="d-flex justify-content-between align-items-center mb-2"><h2>Taktische Lagekarte & Hydrantennetz</h2></div>
<div class="card p-2 bg-white rounded-4 shadow-sm position-relative">
    <div class="map-filter-box">
        <h6 class="fw-bold small text-muted text-uppercase mb-2"><i class="fa fa-filter me-1"></i> Filter</h6>
        <div class="form-check"><input class="form-check-input" type="checkbox" v-model="mapFilters.unterflur" @change="initMap()"><label class="form-check-label small fw-bold text-primary">Unterflurhydranten</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" v-model="mapFilters.ueberflur" @change="initMap()"><label class="form-check-label small fw-bold text-danger">Überflurhydranten</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" v-model="mapFilters.zisterne" @change="initMap()"><label class="form-check-label small fw-bold text-success">Zisternen</label></div>
    </div>
    <div id="map" style="width: 100%; height: 600px; border-radius: 10px; z-index: 10;"></div>
</div>

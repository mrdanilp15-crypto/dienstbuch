<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <title>Passwort zurücksetzen - Digitales Dienstbuch</title>
    <link href="/static/vendor/bootstrap-5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/fontawesome-6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/vendor/fonts-outfit/outfit.css" rel="stylesheet">
    <style>
        :root { color-scheme: dark; }
        body {
            min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
            background: radial-gradient(circle at 20% 10%, #2a1414 0%, #121010 55%, #0d0b0b 100%);
            font-family: 'Outfit', sans-serif; color: #f1f1f1;
        }
        .box {
            width: 100%; max-width: 400px; padding: 36px 30px; border-radius: 24px;
            background: rgba(30, 24, 24, 0.85); border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .logo { font-size: 2.6rem; color: #e53935; text-shadow: 0 0 18px rgba(229,57,53,0.5); }
        label { font-weight: 600; font-size: 0.85rem; color: #e0d8d8; }
        .form-control {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #fff;
            border-radius: 14px; padding: 12px 14px;
        }
        .form-control:focus { background: rgba(255,255,255,0.12); color: #fff; border-color: #b71c1c; box-shadow: 0 0 0 3px rgba(183,28,28,0.25); }
        .btn-submit {
            background: linear-gradient(135deg, #b71c1c 0%, #801313 100%); color: #fff; border: none;
            border-radius: 14px; padding: 12px; font-weight: 700;
        }
        .btn-submit:hover { color: #fff; filter: brightness(1.1); }
        .msg { display: none; border-radius: 12px; padding: 10px 14px; font-size: 0.9rem; margin-bottom: 16px; }
        .msg.err { display: block; background: rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.4); color: #ff8a93; }
        .msg.ok { display: block; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); color: #6ee7b7; }
        a { color: #ff8a80; }
    </style>
</head>
<body>
    <div class="box">
        <div class="text-center mb-4">
            <i class="fa fa-fire logo"></i>
            <h4 class="fw-bold mt-2 mb-1">Neues Passwort</h4>
            <small class="text-white-50">Lege ein neues Passwort für dein Konto fest.</small>
        </div>
        <div id="msg" class="msg"></div>
        <form id="resetForm">
            <div class="mb-3">
                <label for="pw1" class="mb-1">Neues Passwort</label>
                <input type="password" id="pw1" class="form-control" minlength="8" required autocomplete="new-password">
            </div>
            <div class="mb-4">
                <label for="pw2" class="mb-1">Passwort wiederholen</label>
                <input type="password" id="pw2" class="form-control" minlength="8" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-submit w-100">Passwort speichern</button>
        </form>
        <div class="text-center mt-4"><a href="/login">Zurück zum Login</a></div>
    </div>
    <script>
        const token = new URLSearchParams(location.search).get('token') || '';
        const msg = document.getElementById('msg');
        const form = document.getElementById('resetForm');
        function show(text, ok) { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); }
        if (!token) { show('Der Link ist unvollständig. Bitte fordere einen neuen an.', false); form.style.display = 'none'; }
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pw1 = document.getElementById('pw1').value;
            if (pw1 !== document.getElementById('pw2').value) return show('Die Passwörter stimmen nicht überein.', false);
            if (pw1.length < 8) return show('Das Passwort muss mindestens 8 Zeichen lang sein.', false);
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: pw1 })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) return show(data.detail || 'Das hat nicht geklappt.', false);
                form.style.display = 'none';
                show('Passwort gespeichert. Du kannst dich jetzt anmelden.', true);
                setTimeout(() => location.href = '/login', 2500);
            } catch (err) {
                show('Keine Verbindung zum Server.', false);
            }
        });
    </script>
</body>
</html>

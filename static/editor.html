<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dienstbericht-Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; color: #1e293b; padding: 40px 0; }
        .editor-container { max-width: 900px; background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 35px; }
    </style>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
    <div id="app" class="container editor-container shadow-sm" v-if="ready">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h3 class="fw-bold m-0 text-danger"><i class="fa fa-pen-to-square me-2"></i>Dienstbericht erfassen / bearbeiten</h3>
            <button class="btn btn-outline-secondary rounded-pill fw-bold btn-sm" @click="goBack()"><i class="fa fa-arrow-left me-1"></i> Abbrechen</button>
        </div>

        <form @submit.prevent="saveReport">
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label class="small fw-bold mb-1">Datum</label>
                    <input type="date" v-model="report.date" class="form-control fw-bold" required>
                </div>
                <div class="col-md-3">
                    <label class="small fw-bold mb-1">Kategorie</label>
                    <select v-model="report.category" class="form-select fw-bold" required>
                        <option value="Übung">Übung / Ausbildung</option>
                        <option value="Einsatz">Einsatzbericht</option>
                        <option value="Dienst">Sonstiger Dienstabend</option>
                        <option value="Verein">Vereinsveranstaltung</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="small fw-bold mb-1">Dauer (Stunden)</label>
                    <input type="number" step="0.5" v-model.number="report.duration" class="form-control fw-bold" required>
                </div>
                <div class="col-md-3">
                    <label class="small fw-bold mb-1">Ausbilder / Einsatzleiter</label>
                    <input type="text" v-model="report.instructors" class="form-control" placeholder="Name eintragen" list="leaderPresets" required>
                    <datalist id="leaderPresets"><option v-for="l in presets.leaders" :value="l"></datalist>
                </div>
            </div>

            <div class="mb-4">
                <label class="small fw-bold mb-1">Einsatzstichwort / Thema des Dienstabends *</label>
                <input type="text" v-model="report.description" class="form-control fw-bold fs-5" placeholder="z. B. Brandbekämpfung oder Technische Hilfeleistung" list="topicPresets" required>
                <datalist id="topicPresets"><option v-for="t in presets.topics" :value="t"></datalist>
            </div>

            <h5 class="fw-bold text-dark mb-3 border-bottom pb-2"><i class="fa fa-users me-2"></i>Mannschaft & Fahrzeug-Einteilung</h5>
            
            <div class="table-responsive">
                <table class="table table-hover align-middle border">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 80px;" class="text-center">Anwesend</th>
                            <th>Name des Kameraden</th>
                            <th>Dienstgrad</th>
                            <th style="width: 250px;">Fahrzeug-Zuordnung</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="p in report.persons" :key="p.personnel_id">
                            <td class="text-center">
                                <input type="checkbox" v-model="p.is_present" class="form-check-input p-2" style="cursor: pointer;">
                            </td>
                            <td><b :class="p.is_present ? 'text-dark':'text-muted'">{{ p.name }}</b></td>
                            <td><span class="badge bg-light text-dark border">{{ p.rank }}</span></td>
                            <td>
                                <input type="text" v-model="p.vehicle" class="form-control form-control-sm font-monospace" placeholder="z. B. HLF 20" :disabled="!p.is_present">
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="text-end mt-4 border-top pt-3">
                <button type="submit" class="btn btn-danger rounded-pill fw-bold px-5 py-2.5 shadow-sm">
                    <i class="fa fa-floppy-disk me-1"></i> Bericht final abspeichern
                </button>
            </div>
        </form>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    ready: false,
                    sessionId: 0,
                    report: { session_id: 0, date: '', category: 'Übung', duration: 2.0, instructors: '', description: '', persons: [] },
                    presets: { topics: [], leaders: [] }
                }
            },
            methods: {
                goBack() { window.location.href = '/dashboard'; },
                async loadAttendanceData() {
                    const urlParams = new URLSearchParams(window.location.search);
                    this.sessionId = parseInt(urlParams.get('session_id')) || 0;
                    
                    const res = await fetch(`/groups/1/attendance?session_id=${this.sessionId}&t=${new Date().getTime()}`);
                    if (res.ok) {
                        const data = await res.json();
                        this.report.session_id = data.session_id || 0;
                        this.report.date = data.date;
                        this.report.category = data.category;
                        this.report.duration = data.duration;
                        this.report.instructors = data.instructors || '';
                        this.report.description = data.description || '';
                        this.report.persons = data.persons || [];
                        this.presets = data.presets || { topics: [], leaders: [] };
                        this.ready = true;
                    }
                },
                async saveReport() {
                    const payload = {
                        group_id: 1,
                        session_id: this.report.session_id,
                        date: this.report.date,
                        category: this.report.category,
                        duration: this.report.duration,
                        description: this.report.description,
                        instructors: this.report.instructors,
                        entries: this.report.persons.map(p => ({
                            person_id: p.personnel_id,
                            is_present: p.is_present,
                            vehicle: p.vehicle
                        }))
                    };
                    
                    const res = await fetch('/attendance', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (res.ok) {
                        window.location.href = '/dashboard';
                    } else {
                        alert("Fehler beim Speichern des Berichts!");
                    }
                }
            },
            async mounted() {
                await this.loadAttendanceData();
            }
        }).mount('#app');
    </script>
</body>
</html>

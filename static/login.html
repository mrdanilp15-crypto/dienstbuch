<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dienstbuch — Anmeldung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; color: white; }
    </style>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
    <div id="app" class="login-card shadow-lg">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-danger">Digitales Dienstbuch</h2>
            <p class="text-muted small">Bitte melde dich mit deinen Zugangsdaten an</p>
        </div>

        <div class="alert alert-danger py-2 small" v-if="error">{{ error }}</div>

        <form @submit.prevent="handleLogin">
            <div class="mb-3">
                <label class="form-label small fw-bold">Benutzername</label>
                <input type="text" v-model="username" class="form-control bg-dark text-white border-secondary" required placeholder="z. B. admin">
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Kennwort</label>
                <input type="password" v-model="password" class="form-control bg-dark text-white border-secondary" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-danger w-100 rounded-pill fw-bold py-2" :disabled="loading">
                <span v-if="loading">Prüfe Account...</span>
                <span v-else>Anmelden</span>
            </button>
        </form>
    </div>

    <script>
        Vue.createApp({
            data() {
                return { username: '', password: '', error: null, loading: false }
            },
            methods: {
                async handleLogin() {
                    this.loading = true; this.error = null;
                    try {
                        const res = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: this.username, password: this.password })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            window.location.href = data.redirect;
                        } else {
                            this.error = "Benutzername oder Passwort falsch!";
                        }
                    } catch (e) { this.error = "Server temporär nicht erreichbar."; }
                    this.loading = false;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>

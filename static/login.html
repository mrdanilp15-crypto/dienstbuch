<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Digitales Dienstbuch</title>
    <link rel="manifest" href="/static/manifest.json">
    
    <meta name="theme-color" content="#b71c1c">
    <meta name="apple-mobile-web-app-title" content="Dienstbuch">
    <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/static/favicon.svg">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

    <!-- Google Fonts: Outfit -->
    <!-- Lokal ausgeliefert statt live von CDNs (static/vendor/) - siehe Begründung in dashboard.html -->
    <link href="/static/vendor/fonts-outfit/outfit.css" rel="stylesheet">
    <link href="/static/vendor/bootstrap-5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/fontawesome-6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { 
            --primary-color: #b71c1c; 
            --glow-color: rgba(183, 28, 28, 0.4);
            --bg-gradient: radial-gradient(circle at 50% 50%, #221414 0%, #0d0a0a 100%);
        }
        
        body { 
            background: var(--bg-gradient); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Decorative glowing circles */
        .glow-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
        }
        .glow-circle-1 {
            width: 300px;
            height: 300px;
            background: rgba(183, 28, 28, 0.2);
            top: -50px;
            left: -50px;
        }
        .glow-circle-2 {
            width: 400px;
            height: 400px;
            background: rgba(26, 35, 126, 0.15);
            bottom: -100px;
            right: -100px;
        }

        .login-card { 
            width: 100%; 
            max-width: 420px; 
            padding: 50px 40px; 
            border-radius: 24px; 
            background: rgba(18, 14, 14, 0.85); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
            text-align: center; 
            margin: 20px;
            z-index: 10;
            transition: transform 0.3s ease;
        }
        
        .login-card:hover {
            transform: translateY(-5px);
        }

        .fire-icon-container { 
            color: var(--primary-color); 
            margin-bottom: 25px; 
            display: inline-block;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(183, 28, 28, 0.4)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(183, 28, 28, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(183, 28, 28, 0.4)); }
        }

        h2 {
            color: #ffffff;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 0.95rem;
        }

        .form-label {
            color: rgba(255,255,255,0.7);
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.06) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: rgba(255, 255, 255, 0.4) !important;
            border-radius: 16px 0 0 16px !important;
        }

        .form-control { 
            background: rgba(255, 255, 255, 0.08) !important;
            color: #ffffff !important;
            border-radius: 0 16px 16px 0 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            padding: 12px 16px !important;
            transition: all 0.3s ease !important;
        }
        .pw-input {
            border-radius: 0 !important;
        }
        
        .form-control::placeholder {
            color: rgba(255,255,255,0.7) !important;
        }

        .form-control:focus { 
            border-color: var(--primary-color) !important; 
            box-shadow: 0 0 15px var(--glow-color) !important;
            background: rgba(255, 255, 255, 0.12) !important;
        }

        .btn-submit { 
            background: linear-gradient(135deg, #b71c1c 0%, #801313 100%); 
            border: none; 
            border-radius: 16px; 
            padding: 14px; 
            font-weight: 600;
            letter-spacing: 1px;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(183, 28, 28, 0.4);
        }
        
        .btn-submit:hover:not(:disabled) { 
            background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%); 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(183, 28, 28, 0.6);
            color: white;
        }
        
        .btn-submit:active {
            transform: translateY(0);
        }

        .error-msg { 
            color: #ff5252; 
            font-weight: 600; 
            margin-top: 20px; 
            display: none; 
            font-size: 0.9rem;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .loader { display: none; }

        .footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .footer-links a {
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        .footer-links a i {
            color: var(--primary-color);
        }
        .footer-links a:hover {
            color: #ff6b6b;
            text-decoration: underline;
        }
        .legal-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .legal-modal-backdrop.open {
            display: flex;
        }
        .legal-modal {
            background: rgba(18, 14, 14, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            color: rgba(255,255,255,0.85);
            text-align: left;
        }
        .legal-modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .legal-modal-header h5 { margin: 0; color: #fff; }
        .legal-modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .legal-modal-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 1.3rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Decorative background glows -->
    <div class="glow-circle glow-circle-1"></div>
    <div class="glow-circle glow-circle-2"></div>

    <div class="login-card">
        <div class="fire-icon-container">
            <i class="fa-solid fa-fire fa-4x"></i>
        </div>
        <h2 class="mb-2">DIENSTBUCH</h2>
        <p class="subtitle mb-4">Bitte melden Sie sich mit Ihren Zugangsdaten an</p>

        <div id="errorBox" class="error-msg alert alert-danger bg-transparent border-danger border-opacity-25 py-2 mb-3 text-start">
            <i class="fa fa-exclamation-circle me-1"></i> Passwort nicht korrekt!
        </div>

        <form id="loginForm">
            <div class="mb-3 text-start">
                <label class="form-label">Benutzername</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa fa-user"></i></span>
                    <input type="text" id="usernameInput" class="form-control" placeholder="z. B. admin" required autocomplete="username">
                </div>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label">Passwort</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa fa-lock"></i></span>
                    <input type="password" id="passwordInput" class="form-control pw-input" placeholder="********" required autocomplete="current-password">
                    <button class="btn btn-outline-secondary text-white-50" type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()" style="border-radius: 0 16px 16px 0 !important; background: rgba(255,255,255,0.08); border: 1px solid rgba(255, 255, 255, 0.1) !important; border-left: none !important;">
                        <i class="fa fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-submit w-100 shadow">
                <span id="btnText"><i class="fa fa-sign-in-alt me-1"></i> Anmelden</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm loader" role="status"></span>
            </button>
        </form>

        <div class="footer-links">
            <a class="footer-link-item" onclick="openLegalModal('impressum')"><i class="fa fa-circle-info me-1"></i>Impressum</a>
            <span style="color:rgba(255,255,255,0.2);">&bull;</span>
            <a class="footer-link-item" onclick="openLegalModal('datenschutz')"><i class="fa fa-shield-halved me-1"></i>Datenschutz</a>
        </div>
    </div>

    <div class="legal-modal-backdrop" id="legalModalBackdrop" onclick="if(event.target===this) closeLegalModal()">
        <div class="legal-modal">
            <div class="legal-modal-header">
                <h5 id="legalModalTitle">Impressum</h5>
                <button type="button" class="legal-modal-close" onclick="closeLegalModal()"><i class="fa fa-times"></i></button>
            </div>
            <div class="legal-modal-body" id="legalModalBody"></div>
        </div>
    </div>

    <script>
        let legalTexts = { impressum: '', datenschutz: '' };
        fetch('/api/legal').then(r => r.ok ? r.json() : null).then(data => {
            if (!data) return;
            legalTexts.impressum = data.impressum || '';
            legalTexts.datenschutz = data.datenschutz || '';
        }).catch(() => {});

        function openLegalModal(which) {
            document.getElementById('legalModalTitle').textContent = which === 'impressum' ? 'Impressum' : 'Datenschutzerklärung';
            document.getElementById('legalModalBody').textContent = legalTexts[which] || 'Noch nicht hinterlegt.';
            document.getElementById('legalModalBackdrop').classList.add('open');
        }
        function closeLegalModal() {
            document.getElementById('legalModalBackdrop').classList.remove('open');
        }
    </script>
    <script>
        localStorage.clear();

        // Preserve QR code redirect across login
        const params = new URLSearchParams(window.location.search);
        const eqBarcode = params.get('eq_barcode');
        if (eqBarcode) {
            sessionStorage.setItem('eq_barcode_redirect', eqBarcode);
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const usernameInput = document.getElementById('usernameInput');
            const passwordInput = document.getElementById('passwordInput');
            const errorBox = document.getElementById('errorBox');
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            errorBox.style.display = 'none';
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'inline-block';

            const payload = {
                username: usernameInput.value.trim(),
                password: passwordInput.value
            };

            try {
                // Ohne Timeout blieb der "Anmelden"-Button bei einem Netzwerk-Hänger auf dem Handy
                // (z.B. WLAN<->Mobilfunk-Wechsel mitten in der Anfrage) für immer im Lade-Zustand
                // hängen, ganz ohne Fehlermeldung - genau das gemeldete "kommt nicht weiter als die
                // Login-Seite"-Problem. Nach 15s wird die Anfrage abgebrochen und ein echter Fehler
                // angezeigt, statt endlos zu warten.
                const timeoutController = new AbortController();
                const timeoutId = setTimeout(() => timeoutController.abort(), 15000);
                let response;
                try {
                    response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: timeoutController.signal
                    });
                } finally {
                    clearTimeout(timeoutId);
                }

                const data = await response.json();

                if (!response.ok) {
                    const errorMsg = data.detail || 'Benutzername oder Passwort falsch!';
                    errorBox.innerHTML = `<i class="fa fa-exclamation-circle me-1"></i> ${errorMsg}`;
                    errorBox.style.display = 'block';
                    
                    passwordInput.value = '';
                    btn.disabled = false;
                    btnText.style.display = 'inline-block';
                    spinner.style.display = 'none';
                    passwordInput.focus();
                    return;
                }

                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', data.role);
                localStorage.setItem('userName', data.username);

                const savedBarcode = sessionStorage.getItem('eq_barcode_redirect');
                if (savedBarcode) {
                    sessionStorage.removeItem('eq_barcode_redirect');
                    window.location.href = '/dashboard?eq_barcode=' + savedBarcode;
                } else {
                    window.location.href = data.redirect;
                }

            } catch (error) {
                const msg = error.name === 'AbortError'
                    ? 'Zeitüberschreitung - Server antwortet nicht. Bitte Internetverbindung prüfen.'
                    : 'Verbindung zum Server fehlgeschlagen!';
                errorBox.innerHTML = `<i class="fa fa-exclamation-circle me-1"></i> ${msg}`;
                errorBox.style.display = 'block';
                btn.disabled = false;
                btnText.style.display = 'inline-block';
                spinner.style.display = 'none';
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', handleLogin);

        // Register ServiceWorker for PWA installation
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('ServiceWorker registered:', reg.scope);
                }).catch(err => {
                    console.error('ServiceWorker registration failed:', err);
                });
            });
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('togglePasswordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa fa-eye';
            }
        }
    </script>
</body>
</html>

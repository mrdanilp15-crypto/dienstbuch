<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Digitales Dienstbuch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=10.0">
</head>
<body>
    <div class="login-card text-center">
        <div class="fire-icon-container"><i class="fa fa-book-open"></i></div>
        <h3 class="fw-bold mb-1 text-dark">Digitales <span class="text-danger">Dienstbuch</span></h3>
        <p class="text-muted small mb-4">Sicheres Portal — Autorisierter Zugriff</p>
        <div id="errorBox" class="alert alert-danger py-2 small mb-3 text-start hidden"></div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold text-secondary">Benutzername</label>
                <input type="text" id="usernameInput" class="form-control" placeholder="Benutzername eingeben" required autocomplete="username">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label small fw-bold text-secondary">Passwort</label>
                <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" id="submitBtn" class="btn btn-submit">Identität verifizieren</button>
        </form>
    </div>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const errorBox = document.getElementById('errorBox');
            const btn = document.getElementById('submitBtn');
            errorBox.style.display = 'none'; btn.disabled = true;
            try {
                const response = await fetch('/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: document.getElementById('usernameInput').value.trim(), password: document.getElementById('passwordInput').value })
                });
                const data = await response.json();
                if (!response.ok) { errorBox.innerText = data.detail; errorBox.style.display = 'block'; btn.disabled = false; return; }
                window.location.href = data.redirect;
            } catch (error) { errorBox.innerText = "Sicherheits-Gateway offline!"; errorBox.style.display = 'block'; btn.disabled = false; }
        }
    </script>
</body>
</html>

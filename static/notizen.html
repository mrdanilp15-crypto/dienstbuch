<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Funkraum - Notizen & Mängelmeldungen</title>
    
    <!-- Premium Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <style>
        :root { 
            --primary: #b71c1c; 
            --bg-color: #121010; 
            --card-bg: rgba(30, 24, 24, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --public-color: #10b981; 
            --private-color: #3b82f6; 
            --gw-color: #f59e0b;
        }
        
        body { 
            background: radial-gradient(circle at 50% 50%, #201414 0%, var(--bg-color) 100%); 
            font-family: 'Outfit', sans-serif; 
            color: var(--text-primary);
        }
        
        .navbar { 
            background: rgba(18, 14, 14, 0.9) !important;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--card-border); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.4); 
        }

        .premium-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .premium-card:hover {
            box-shadow: 0 15px 35px rgba(183, 28, 28, 0.1);
        }
        
        .filter-pill { 
            font-weight: 600; 
            font-size: 0.85rem; 
            border-radius: 20px; 
            padding: 8px 18px; 
            border: 1px solid var(--card-border); 
            background: rgba(255,255,255,0.05); 
            color: var(--text-secondary); 
            transition: all 0.2s ease; 
        }
        .filter-pill:hover, .filter-pill.active { 
            background: rgba(183, 28, 28, 0.15) !important; 
            color: white !important; 
            border-color: var(--primary); 
            box-shadow: 0 0 10px rgba(183, 28, 28, 0.3);
        }
        
        .note-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            border: 1px solid var(--card-border); 
            padding: 20px; 
            transition: all 0.3s ease; 
            position: relative; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.25); 
        }
        .note-card:hover { 
            box-shadow: 0 15px 35px rgba(183, 28, 28, 0.15); 
            transform: translateY(-2px); 
            border-color: rgba(183, 28, 28, 0.3);
        }
        
        .badge-vis { 
            font-size: 0.65rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            padding: 4px 12px; 
            border-radius: 50px; 
            letter-spacing: 0.5px;
        }
        .vis-public { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.25); }
        .vis-private { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.25); }
        .vis-admin { background: rgba(239, 68, 68, 0.15); color: #ff5252; border: 1px solid rgba(239, 68, 68, 0.25); }
        .vis-geratewart { background: rgba(245, 158, 11, 0.15); color: #ffd700; border: 1px solid rgba(245, 158, 11, 0.25); }

        .form-control, .form-textarea {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #ffffff !important;
            border-radius: 12px;
        }
        .form-control:focus, .form-textarea:focus {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: var(--primary) !important;
            color: #ffffff !important;
            box-shadow: 0 0 10px rgba(183, 28, 28, 0.3) !important;
        }

        .form-check-input {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .form-check-input:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .btn-premium {
            background: linear-gradient(135deg, #b71c1c 0%, #801313 100%);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 14px;
            padding: 10px 24px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(183, 28, 28, 0.3);
        }
        .btn-premium:hover {
            background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(183, 28, 28, 0.5);
            color: white;
        }

        .form-label {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        [v-cloak] { display: none !important; }
    </style>
</head>
<body>

<div id="app" v-cloak>
    <!-- Top Nav -->
    <nav class="navbar sticky-top p-2 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <h4 class="fw-bold text-danger m-0 d-flex align-items-center gap-2">
                <i class="fa fa-sticky-note"></i> Funkraum & Whiteboard
            </h4>
            <a href="/dashboard" class="btn btn-outline-danger rounded-pill px-4 fw-bold"><i class="fa fa-arrow-left me-1"></i>Portal</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row g-4">
            
            <!-- LEFT PANEL: CREATE/EDIT FORM -->
            <div class="col-lg-4">
                <div class="card premium-card p-4 sticky-top" style="top: 85px; z-index: 10;">
                    <h5 class="fw-bold mb-4 text-white">
                        <i class="fa-regular fa-pen-to-square text-danger me-2"></i>
                        {{ editingId ? 'Notiz bearbeiten' : 'Notiz verfassen' }}
                    </h5>
                    
                    <form @submit.prevent="saveNote">
                        <div class="mb-3">
                            <label class="form-label">Betreff / Titel</label>
                            <input type="text" v-model="newNote.title" class="form-control" placeholder="z. B. Defekt an HLF Geräteraum 3" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Details / Beschreibung</label>
                            <textarea v-model="newNote.content" class="form-control" rows="5" placeholder="Beschreibe die Notiz oder den Defekt so genau wie möglich..." required></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label mb-2 d-block">Sichtbarkeitsstufe</label>
                            
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" id="r-private" value="private" v-model="newNote.visibility">
                                <label class="form-check-label small fw-bold text-secondary" for="r-private">
                                    <i class="fa fa-lock me-2 text-primary"></i>Privat (Nur für mich)
                                </label>
                            </div>
                            
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" id="r-public" value="public" v-model="newNote.visibility">
                                <label class="form-check-label small fw-bold text-secondary" for="r-public">
                                    <i class="fa fa-users me-2 text-success"></i>Öffentlich (Für alle)
                                </label>
                            </div>

                            <div class="form-check mb-2" v-if="currentUser.role === 'admin'">
                                <input class="form-check-input" type="radio" id="r-admin" value="admin" v-model="newNote.visibility">
                                <label class="form-check-label small fw-bold text-danger" for="r-admin">
                                    <i class="fa fa-user-shield me-2"></i>Admin Intern
                                </label>
                            </div>

                            <div class="form-check mb-0">
                                <input class="form-check-input" type="radio" id="r-gw" value="geratewart" v-model="newNote.visibility">
                                <label class="form-check-label small fw-bold text-warning" for="r-gw">
                                    <i class="fa fa-wrench me-2"></i>Defekt an Gerätewart melden
                                </label>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button v-if="editingId" type="button" class="btn btn-outline-light rounded-pill fw-bold flex-fill" @click="cancelEdit">
                                Abbrechen
                            </button>
                            <button type="submit" class="btn btn-premium rounded-pill flex-fill py-2">
                                <i class="fa fa-save me-2"></i>{{ editingId ? 'Speichern' : 'Senden' }}
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- RIGHT PANEL: LIST & FILTER -->
            <div class="col-lg-8">
                <div class="d-flex flex-wrap gap-2 mb-4">
                    <button class="filter-pill" :class="{active: activeFilter === 'all'}" @click="activeFilter = 'all'">Alle Notizen</button>
                    <button class="filter-pill" :class="{active: activeFilter === 'private'}" @click="activeFilter = 'private'"><i class="fa fa-lock me-1"></i>Meine Privaten</button>
                    <button class="filter-pill" :class="{active: activeFilter === 'public'}" @click="activeFilter = 'public'"><i class="fa fa-users me-1"></i>Öffentliche Pinnwand</button>
                    <button class="filter-pill" :class="{active: activeFilter === 'geratewart'}" @click="activeFilter = 'geratewart'"><i class="fa fa-wrench me-1"></i>Gerätewart-Meldungen</button>
                    <button v-if="currentUser.role === 'admin'" class="filter-pill text-danger" :class="{active: activeFilter === 'admin'}" @click="activeFilter = 'admin'"><i class="fa fa-user-shield me-1"></i>Admin Intern</button>
                </div>

                <div class="row g-3">
                    <div class="col-12" v-for="n in filteredNotes" :key="n.id">
                        <div class="note-card" :style="editingId === n.id ? 'border-color: var(--primary); background-color: rgba(183, 28, 28, 0.05);' : ''">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="d-flex align-items-center gap-2 flex-wrap">
                                    <span :class="['badge-vis', 'vis-' + n.visibility]">{{ getVisLabel(n.visibility) }}</span>
                                    <small class="text-muted"><i class="fa-regular fa-clock me-1"></i>{{ n.date_formatted }} Uhr &bull; <i class="fa-regular fa-circle-user me-1 text-danger"></i><b>{{ n.username }}</b></small>
                                </div>
                                <div class="d-flex gap-1">
                                    <button v-if="n.username === currentUser.username" class="btn btn-sm btn-outline-light border-0 rounded-circle" @click="startEdit(n)" title="Bearbeiten" style="width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;">
                                        <i class="fa fa-edit text-primary"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-light border-0 rounded-circle" @click="deleteNote(n.id)" title="Löschen" style="width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;">
                                        <i class="fa fa-trash-alt text-danger"></i>
                                    </button>
                                </div>
                            </div>
                            <h5 class="fw-bold text-white mb-2">{{ n.title }}</h5>
                            <p class="text-secondary m-0" style="white-space: pre-wrap; line-height: 1.5;">{{ n.content }}</p>
                        </div>
                    </div>

                    <div v-if="filteredNotes.length === 0" class="col-12 text-center text-muted py-5 premium-card">
                        <i class="fa fa-folder-open h1 d-block mb-3 opacity-25 text-danger"></i>
                        Keine Notizen in dieser Kategorie vorhanden.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp } = Vue;

    createApp({
        data() {
            return {
                currentUser: { username: '', role: '' },
                notes: [],
                activeFilter: 'all',
                editingId: null,
                newNote: { title: '', content: '', visibility: 'private' }
            }
        },
        computed: {
            filteredNotes() {
                if (this.activeFilter === 'all') return this.notes;
                return this.notes.filter(n => n.visibility === this.activeFilter);
            }
        },
        async mounted() {
            try {
                const authRes = await fetch('/api/auth/me', { credentials: 'include' });
                if (!authRes.ok) { window.location.href = '/'; return; }
                this.currentUser = await authRes.json();
            } catch (e) { window.location.href = '/'; return; }

            await this.loadNotes();
        },
        methods: {
            async loadNotes() {
                try {
                    const res = await fetch('/api/notes', { credentials: 'include' });
                    if (res.ok) { this.notes = await res.json(); }
                } catch (e) { console.error("Fehler beim Laden", e); }
            },
            async saveNote() {
                try {
                    const isEdit = this.editingId !== null;
                    const url = isEdit ? `/api/notes/${this.editingId}` : '/api/notes';
                    const method = isEdit ? 'PUT' : 'POST';

                    const res = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(this.newNote)
                    });

                    if (res.ok) {
                        this.newNote.title = '';
                        this.newNote.content = '';
                        this.editingId = null;
                        await this.loadNotes();
                    } else {
                        alert("Eintrag konnte nicht gespeichert werden.");
                    }
                } catch (e) { alert("Serverfehler beim Senden."); }
            },
            startEdit(note) {
                this.editingId = note.id;
                this.newNote.title = note.title;
                this.newNote.content = note.content;
                this.newNote.visibility = note.visibility;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },
            cancelEdit() {
                this.editingId = null;
                this.newNote.title = '';
                this.newNote.content = '';
                this.newNote.visibility = 'private';
            },
            async deleteNote(id) {
                if (confirm("Möchtest du diesen Eintrag permanent löschen?")) {
                    try {
                        const res = await fetch(`/api/notes/${id}`, { method: 'DELETE', credentials: 'include' });
                        if (res.ok) { 
                            if (this.editingId === id) this.cancelEdit();
                            await this.loadNotes(); 
                        } else { 
                            alert("Löschen fehlgeschlagen (Fehlende Berechtigung)."); 
                        }
                    } catch (e) { alert("Verbindungsfehler."); }
                }
            },
            getVisLabel(vis) {
                if (vis === 'public') return 'Öffentlich';
                if (vis === 'private') return 'Privat';
                if (vis === 'admin') return 'Admin Intern';
                if (vis === 'geratewart') return '⚠️ Defekt an Gerätewart';
                return vis;
            }
        }
    }).mount('#app');
</script>
</body>
</html>
